<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>zarcube — 4D data cubes</title>
    <meta
      name="description"
      content="4D data cubes from the zartigl catalog as interactive volumes: slices, sections, isotherms and currents through time. The Pacific thermocline (GODAS) and Lake Geneva (Alplakes)." />
  </head>
  <body>
    <div class="app">
      <nav class="appbar" aria-label="zarcube">
        <div class="appbar-start">
          <span class="brand">ZARCUBE</span>
          <button
            type="button"
            id="context"
            class="bar-button context-button"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Contexts: open, import, export">
            <span id="context-title">CONTEXT</span>
            ▾
          </button>
        </div>
        <div class="appbar-end">
          <button
            type="button"
            id="data"
            class="bar-button"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Data kept in this browser">
            DATA
          </button>
          <button
            type="button"
            id="video"
            class="bar-button"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Export an MP4 clip from the shown step">
            VIDEO
          </button>
        </div>
      </nav>
      <header class="meta frame">
        <div class="meta-title">
          <h1 id="entry-title">zarcube</h1>
          <p id="entry-subtitle"></p>
          <p id="entry-provider"></p>
        </div>
        <dl class="meta-dataset" id="dataset"></dl>
      </header>

      <aside class="side-left">
        <section class="panel roi" id="about" hidden>
          <h2 id="about-title"></h2>
          <p class="note" id="about-note"></p>
          <p class="roi-box" id="about-detail"></p>
        </section>
        <section class="panel">
          <h2>NAVIGATION (CUBE)</h2>
          <div class="sliders" id="sliders"></div>
        </section>
        <section class="panel display">
          <h2>DISPLAY</h2>
          <div class="checks">
            <label class="check">
              <input type="checkbox" id="show-slices" checked />
              <span>SLICE PLANES</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-iso" checked />
              <span id="label-iso">ISO-SURFACE</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-contours" checked />
              <span>CONTOURS</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-coast" checked />
              <span id="label-coast">COASTLINES</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-roi" checked />
              <span id="label-roi">BOXES</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-pois" checked />
              <span>PLACES</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-particles" />
              <span>PARTICLES</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-box" checked />
              <span>BOX</span>
            </label>
            <label class="check">
              <input type="checkbox" id="show-bed" checked />
              <span>BED</span>
            </label>
          </div>
          <div class="segments">
            <div
              class="segmented"
              id="mode-group"
              role="radiogroup"
              aria-label="Values">
              <button type="button" data-mode="absolute" aria-pressed="true">
                ABSOLUTE
              </button>
              <button type="button" data-mode="anomaly" aria-pressed="false">
                ANOMALY
              </button>
            </div>
            <div id="palettes" class="palettes"></div>
          </div>
        </section>
      </aside>

      <main class="view frame">
        <div class="view-head">
          <span class="tag" id="view-name">3D ISO</span>
          <div class="presets" role="group" aria-label="View">
            <button type="button" data-view="iso" aria-pressed="true">
              ISO
            </button>
            <button type="button" data-view="top" aria-pressed="false">
              TOP
            </button>
            <button type="button" data-view="front" aria-pressed="false">
              FRONT
            </button>
            <button type="button" data-view="side" aria-pressed="false">
              SIDE
            </button>
            <button type="button" data-view="cavalier" aria-pressed="false">
              CAVALIER
            </button>
          </div>
          <span class="month" id="view-month">—</span>
        </div>
        <div class="stage" id="stage">
          <canvas
            id="cube"
            role="img"
            aria-label="Interactive 3D data cube"></canvas>
          <div class="hud">
            <div id="pick">PICK —</div>
            <div id="scale"></div>
          </div>
          <div class="loading" id="loading" hidden></div>
        </div>
        <figure class="legend">
          <figcaption id="legend-title">COLORMAP (°C)</figcaption>
          <canvas id="legend"></canvas>
        </figure>
      </main>

      <aside class="side-right">
        <section class="panel slice" data-slice="top">
          <h2 class="slice-title"></h2>
        </section>
        <section class="panel slice" data-slice="eq">
          <h2 class="slice-title"></h2>
        </section>
        <section class="panel slice" data-slice="side">
          <h2 class="slice-title"></h2>
        </section>
      </aside>

      <footer class="time frame">
        <div class="time-head">
          <h2>
            TIME —
            <span id="time-cadence">MONTHLY</span>
            DATA
            <span id="time-range"></span>
          </h2>
          <span class="time-legend" id="time-legend" hidden>
            <span id="episode-key" hidden>
              <i class="warm"></i>
              El Niño
              <i class="cold"></i>
              La Niña ·
            </span>
            <span id="indicator-label"></span>
          </span>
        </div>
        <div class="time-body">
          <div class="timeline" id="timeline"></div>
          <div class="transport">
            <div class="group" role="group" aria-label="Playback">
              <button type="button" id="first" aria-label="First step">
                ⏮
              </button>
              <button type="button" id="back" aria-label="Previous step">
                ⏪
              </button>
              <button type="button" id="play" class="play" aria-label="Play">
                ▶
              </button>
              <button type="button" id="forward" aria-label="Next step">
                ⏩
              </button>
              <button type="button" id="last" aria-label="Last step">⏭</button>
            </div>
            <div class="group" role="group" aria-label="Time">
              <output class="time-chip" id="time-chip">t = —</output>
              <select id="speed" aria-label="Speed"></select>
            </div>
          </div>
        </div>
        <p class="credit" id="credit"></p>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
